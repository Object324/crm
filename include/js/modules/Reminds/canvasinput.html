<html>
<head>
<script src="CanvasInput.min.js"></script>

</head>
<body>


<div id="dvtest" style="width:300px;height:300px;backgroud-color:#eff;position:absolute">
      <canvas id="canvasrec" style="left: 10px;top:10px;width:100%;height:100%">
         
       
       </canvas>
       <textarea style="position: absolute;top:20;left:20" id="wwe">
       
       
       </textarea>
       <div  id="test" style="position:absolute;border-color: rgb(136, 51, 51); border: 1px solid red ;border-radius: 8px; width: 10px; height: 10px; left: 4px; top: 51px;"></div>
</div>
  <canvas style="top: 310px;position:absolute" id="curve">
  </canvas>

</body>
<style type="text/css">



</style>
<script  type="text/javascript">

    var rec2d=document.getElementById("canvasrec");
    var ctx=rec2d.getContext("2d");
    var ctxcurve=document.getElementById("curve").getContext("2d");
    ctxcurve.beginPath();
    ctxcurve.moveTo(10,10);
    ctxcurve.lineTo(10,100);
    
    ctxcurve.lineWidth = 5;          //设置线宽状态
ctxcurve.strokeStyle ="#222" ;  //设置线的颜色状态
ctxcurve.stroke();
ctxcurve.beginPath();
ctxcurve.moveTo(10,100);
ctxcurve.strokeStyle ="red" ;  //设置线的颜色状态
ctxcurve.lineTo(100,100);
ctxcurve.stroke();
function init()
{
    ctx.rect(0,0,rec2d.width,rec2d.height);
    ctx.strokeStyle="red";
    ctx.stroke();
}
var testobj=document.getElementById("test");
var isdown=false;
var startx,starty;
var endx,endy;
testobj.onmousedown=function(event)
{
    document.getElementById("wwe").style.display='none';
    var e=event||window.event;
    isdown=true;
    startx=e.clientX;
    starty=e.clientY;
    e.srcElement.style.cursor="w-resize";
    
}
testobj.onmouseup=function(e)
{
    var event=e||window.event;
    isdown=false;
    
}
var dvtest=document.getElementById("dvtest");
testobj.onmousemove=function(event)
{

    var e=event||window.event;
    if(isdown)
    {
        endx=e.clientX;
        var minwidth=endx-startx;
         e.srcElement.style.left=endx+"px";
        if(minwidth>=2)
        {
              
            startx=endx;
           
            dvtest.style.width=parseInt(dvtest.style.width )-100+"px";
            dvtest.style.left=parseInt(dvtest.style.left)+100+"px";
            
            init();
        }
    }
    
}

 init();
</script>


</html>
